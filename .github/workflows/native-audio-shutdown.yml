name: Portable native audio shutdown
on:
  pull_request:
    paths:
      - 'src/core/game3/audio.lua'
      - 'src/core/Sound.lua'
      - 'src/core/Music.lua'
      - 'tests/engine/native_audio_shutdown.lua'
      - 'tools/audio-shutdown-contract-check/**'
      - '.github/workflows/native-audio-shutdown.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: gen2
      - uses: actions/checkout@v7
        with:
          repository: bryanthaboi/gen1recomp
          ref: 535a5ec088c1ae1bf4d91dd3e35a56f64cf46d91
          path: gen1-reference
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Native shutdown and existing ownership
        working-directory: gen2
        run: |
          luajit tools/audio-shutdown-contract-check/check.lua gen2 "$GITHUB_WORKSPACE/gen2"
          luajit tests/engine/native_audio_source.lua
          luajit tests/engine/native_session_callbacks.lua
          luajit tests/engine/native_game_coroutine_scopes.lua
      - name: Same shutdown observations against pinned reference
        working-directory: gen1-reference
        run: luajit "$GITHUB_WORKSPACE/gen2/tools/audio-shutdown-contract-check/check.lua" gen1 "$GITHUB_WORKSPACE/gen2"
