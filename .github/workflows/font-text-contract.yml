name: Font text contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  font:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: luajit tests/engine/font_text_contract.lua
