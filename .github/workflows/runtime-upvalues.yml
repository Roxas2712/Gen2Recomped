name: Native runtime capacity
on:
  pull_request:
    paths:
      - '.github/workflows/runtime-upvalues.yml'
      - 'tools/runtime-upvalue-check/**'
      - 'tools/build_native_preview.py'
      - 'tools/package_native_release.py'
      - 'tools/fetch_love_runtime.py'
      - 'tests/test_fetch_love_runtime.py'
      - 'tests/test_runtime_component.py'
      - 'tests/test_runtime_qualification.py'
      - 'tests/test_native_preview.py'
      - 'src/mods/Job*.lua'
      - 'src/mods/job_worker.lua'
      - 'src/mods/ImportAccess.lua'
      - 'tests/native_jobs_runtime/**'
      - 'tools/qualify_native_jobs.py'
  workflow_dispatch:
    inputs:
      windows_only:
        description: Qualify only the Windows preview dependency
        type: boolean
        default: false
      package_runtime_run_id:
        description: Package and test the Windows demo using an already qualified runtime run
        type: string
        default: ''
      native_games_only:
        description: Build and test the ROM-free Windows 3DS and Pinball SDK
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
concurrency:
  group: runtime-upvalues-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    if: ${{ inputs.windows_only != true && !inputs.package_runtime_run_id && !inputs.native_games_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x64
          - runner: windows-2022
            label: windows-x64
            love-artifact: '12514271124'
            library: lua51.dll
          - runner: macos-15-intel
            label: macos-x64
            love-artifact: '12513712494'
            library: libluajit.so
            engine-timeout: 2400
            job-timeout: 90
          - runner: macos-15
            label: macos-arm64
            love-artifact: '12513712494'
            library: libluajit.so
    runs-on: ${{ matrix.runner }}
    # Two complete engine runs, each bounded at 40 minutes, plus both runtime
    # builds and the actual LOVE host checks. No tier is skipped on slow hosts.
    timeout-minutes: ${{ matrix.job-timeout || 90 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: engine
          ref: ${{ github.sha }}
      - uses: actions/checkout@v7
        with:
          repository: LuaJIT/LuaJIT
          ref: a4c064539ea931274d407e1249b4bb575424a0f4
          path: runtime-source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Verify qualification logging and failure handling
        shell: bash
        run: python -m unittest discover -s engine/tests -p test_runtime_qualification.py -v
      - name: Verify pinned host download contracts
        shell: bash
        run: python -m unittest discover -s engine/tests -p 'test_fetch_love_runtime.py'
      - name: Fetch pinned LOVE12 host artifact
        if: matrix.love-artifact != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python engine/tools/fetch_love_runtime.py
          --artifact "${{ matrix.love-artifact }}"
          --output "${{ runner.temp }}/love-runtime.zip"
      - name: Build both runtimes and qualify closures, C API and engine
        shell: bash
        run: >-
          python engine/tools/runtime-upvalue-check/qualify.py
          --luajit-source runtime-source
          --output "${{ runner.temp }}/runtime-capacity/candidate"
          --engine-tests
          --engine-timeout ${{ matrix.engine-timeout || 2400 }}
      - name: Qualify the actual LOVE12 host, thread VM and FFI
        if: matrix.love-artifact != ''
        shell: bash
        run: >-
          python engine/tools/runtime-upvalue-check/love_abi.py
          --runtime-archive "${{ runner.temp }}/love-runtime.zip"
          --qualification "${{ runner.temp }}/runtime-capacity/candidate/report.json"
          --library "${{ runner.temp }}/runtime-capacity/candidate/artifacts/extended/${{ matrix.library }}"
          --output "${{ runner.temp }}/runtime-love-abi/candidate"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-capacity-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/runtime-capacity/candidate/report.json
            ${{ runner.temp }}/runtime-capacity/candidate/*.log
            ${{ runner.temp }}/runtime-capacity/candidate/artifacts/
            ${{ runner.temp }}/runtime-love-abi/candidate/report.json
            ${{ runner.temp }}/runtime-love-abi/candidate/*.log
            ${{ runner.temp }}/runtime-love-abi/candidate/native-jobs/*.json
            ${{ runner.temp }}/runtime-love-abi/candidate/native-jobs/*.log
          if-no-files-found: error
          retention-days: 14
  components:
    needs: qualify
    # Packaging only: lipo combines the two already-qualified slices. Keep ARM
    # execution in qualify; this step can use the less congested Intel pool.
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: engine
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-capacity-*
          path: runtime-candidates
      - name: Verify component packaging guards
        shell: bash
        run: python -m unittest discover -s engine/tests -p test_runtime_component.py -v
      - name: Combine the two qualified Mac slices
        shell: bash
        run: >-
          python engine/tools/runtime-upvalue-check/component.py
          --platform macos
          --candidate runtime-candidates/runtime-capacity-macos-x64
          --candidate runtime-candidates/runtime-capacity-macos-arm64
          --output "${{ runner.temp }}/qualified-runtime/candidate/macos"
      - name: Stage the qualified Windows component
        shell: bash
        run: >-
          python engine/tools/runtime-upvalue-check/component.py
          --platform windows
          --candidate runtime-candidates/runtime-capacity-windows-x64
          --output "${{ runner.temp }}/qualified-runtime/candidate/windows"
      - uses: actions/upload-artifact@v7
        with:
          name: qualified-desktop-runtime
          path: ${{ runner.temp }}/qualified-runtime/candidate/
          if-no-files-found: error
          retention-days: 14
  windows-preview:
    if: ${{ inputs.windows_only == true && !inputs.package_runtime_run_id && !inputs.native_games_only }}
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: engine
          ref: ${{ github.sha }}
      - uses: actions/checkout@v7
        with:
          repository: LuaJIT/LuaJIT
          ref: a4c064539ea931274d407e1249b4bb575424a0f4
          path: runtime-source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Verify qualification logging and failure handling
        shell: bash
        run: python -m unittest discover -s engine/tests -p test_runtime_qualification.py -v
      - name: Verify pinned host download contracts
        shell: bash
        run: python -m unittest discover -s engine/tests -p 'test_fetch_love_runtime.py'
      - name: Fetch pinned LOVE12 host artifact
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          python engine/tools/fetch_love_runtime.py
          --artifact "12514271124"
          --output "${{ runner.temp }}/love-runtime.zip"
      - name: Build both runtimes and qualify closures, C API and engine
        shell: bash
        run: >-
          python engine/tools/runtime-upvalue-check/qualify.py
          --luajit-source runtime-source
          --output "${{ runner.temp }}/runtime-capacity/candidate"
          --engine-tests
          --engine-timeout 2400
      - name: Qualify the actual LOVE12 host, thread VM and FFI
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          python engine/tools/runtime-upvalue-check/love_abi.py
          --runtime-archive "${{ runner.temp }}/love-runtime.zip"
          --qualification "${{ runner.temp }}/runtime-capacity/candidate/report.json"
          --library "${{ runner.temp }}/runtime-capacity/candidate/artifacts/extended/lua51.dll"
          --output "${{ runner.temp }}/runtime-love-abi/candidate"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-capacity-windows-x64
          path: |
            ${{ runner.temp }}/runtime-capacity/candidate/report.json
            ${{ runner.temp }}/runtime-capacity/candidate/*.log
            ${{ runner.temp }}/runtime-capacity/candidate/artifacts/
            ${{ runner.temp }}/runtime-love-abi/candidate/report.json
            ${{ runner.temp }}/runtime-love-abi/candidate/*.log
            ${{ runner.temp }}/runtime-love-abi/candidate/native-jobs/*.json
            ${{ runner.temp }}/runtime-love-abi/candidate/native-jobs/*.log
          if-no-files-found: error
          retention-days: 14
      - name: Assemble the two checked Windows reports
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/windows-input" -Force | Out-Null
          Copy-Item -Recurse "$env:RUNNER_TEMP/runtime-capacity/candidate" "$env:RUNNER_TEMP/windows-input/capacity"
          Copy-Item -Recurse "$env:RUNNER_TEMP/runtime-love-abi/candidate" "$env:RUNNER_TEMP/windows-input/host"
      - name: Verify the Windows component and exact engine source binding
        shell: bash
        run: >-
          python engine/tools/runtime-upvalue-check/component.py
          --platform windows
          --candidate "${{ runner.temp }}/windows-input"
          --output "${{ runner.temp }}/windows-cloud-runtime"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-cloud-runtime
          path: ${{ runner.temp }}/windows-cloud-runtime/
          if-no-files-found: error
          retention-days: 14
  windows-demo-package:
    if: ${{ inputs.package_runtime_run_id != '' }}
    uses: ./.github/workflows/windows-cloud-demo.yml
    permissions:
      contents: read
      actions: read
    with:
      runtime_run_id: ${{ inputs.package_runtime_run_id }}
  windows-native-games:
    if: ${{ inputs.native_games_only == true }}
    uses: ./.github/workflows/windows-native-games.yml
