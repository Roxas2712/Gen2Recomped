name: Native runtime capacity
on:
  pull_request:
    paths:
      - '.github/workflows/runtime-upvalues.yml'
      - 'tools/runtime-upvalue-check/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-upvalues-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            label: linux-x64
          - runner: windows-2022
            label: windows-x64
          - runner: macos-15-intel
            label: macos-x64
          - runner: macos-15
            label: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          path: engine
      - uses: actions/checkout@v7
        with:
          repository: LuaJIT/LuaJIT
          ref: a4c064539ea931274d407e1249b4bb575424a0f4
          path: runtime-source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build both runtimes and qualify closures, C API and engine
        shell: bash
        run: >-
          python engine/tools/runtime-upvalue-check/qualify.py
          --luajit-source runtime-source
          --output "${{ runner.temp }}/runtime-capacity/candidate"
          --engine-tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-capacity-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/runtime-capacity/candidate/report.json
            ${{ runner.temp }}/runtime-capacity/candidate/*.log
            ${{ runner.temp }}/runtime-capacity/candidate/artifacts/
          if-no-files-found: error
          retention-days: 14
