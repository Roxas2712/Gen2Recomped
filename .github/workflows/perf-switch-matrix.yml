name: performance switch matrix
on:
  pull_request:
    paths:
      - 'src/core/Performance.lua'
      - 'src/mods/**'
      - 'src/render/**'
      - 'tools/perf_switch_matrix.sh'
      - '.github/workflows/perf-switch-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: perf-switch-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Environment parser
        run: luajit tools/perf_env_check.lua
      - name: Every switch off, one at a time
        run: sh tools/perf_switch_matrix.sh
