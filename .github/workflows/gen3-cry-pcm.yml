name: Gen3 compressed cry PCM contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pcm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install ROM-free runtime
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Verify compressed block and reconstruction contracts
        run: |
          luajit tests/engine/gen3_cry_pcm.lua
          luajit tests/engine/gen3_audio_modes.lua
          luajit tests/engine/gen3_cry_owner.lua
          luajit tests/engine/gen3_audio_prep.lua
      - name: Verify native scene and script completion ownership
        run: |
          luajit tests/engine/rs_scene_cry_completion.lua
          luajit tests/engine/gen3_native_cry.lua
          luajit tests/engine/rs_boot_contract.lua
          luajit tests/engine/rs_birch_contract.lua
