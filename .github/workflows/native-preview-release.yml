name: Frozen main iOS test package on Intel host
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-ios-intel-test-20261028-3
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 90a3b093e62d85440d0a1b8288e30e0caf3cc358
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Download the published frozen engine payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "90a3b093e62d85440d0a1b8288e30e0caf3cc358"
          gh api repos/Roxas2712/Gen2Recomped/releases/assets/686181921 -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/Gen2Recomped-NativePreview.love"
          python3 -c 'import hashlib,pathlib,os; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"Gen2Recomped-NativePreview.love"; assert hashlib.file_digest(p.open("rb"),"sha256").hexdigest()=="e4541d2dfff3dc59ad173a466342bb2be3a712f8d59292241a27bac9015df04f"'
      - name: Build from exact main source and verify embedded bytes
        run: >-
          python3 tools/package_native_port.py --platform ios
          --payload "$RUNNER_TEMP/Gen2Recomped-NativePreview.love"
          --release-id 20261028.3 --engine-version 0.8.57
          --out "$RUNNER_TEMP/ios"
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-main-test-ios
          path: ${{ runner.temp }}/ios/*
          if-no-files-found: error
          retention-days: 14
