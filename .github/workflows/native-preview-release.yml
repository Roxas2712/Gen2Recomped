name: RetroRecomped intermediate pre-release
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Preview identifier (YYYYMMDD.N)'
        required: true
        type: string
      engine_version:
        description: 'Engine version stamped into all packages (X.Y.Z)'
        required: true
        type: string
      notarize_macos:
        description: 'Require Developer ID signing and Apple notarization (configured secrets required)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-preview-publish
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: python3 tools/run_retro_launcher_contract.py
      - run: python3 tests/game_payload_test.py
      - run: python3 tests/native_release_test.py
      - run: python3 -m unittest discover -s tests -p test_native_preview.py
  runtime:
    needs: contract
    uses: ./.github/workflows/runtime-upvalues.yml
  build:
    needs: [contract, runtime]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: qualified-desktop-runtime
          path: qualified-runtime
      - name: Verify preview packaging guards
        run: python3 -m unittest discover -s tests -p test_native_preview.py -v
      - name: Prepare private Apple signing keychain
        if: inputs.notarize_macos || vars.NATIVE_MACOS_NOTARIZE == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 tools/macos_distribution.py setup-ci
      - name: Package committed source with qualified extended runtimes
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ENGINE_VERSION: ${{ inputs.engine_version }}
        run: >-
          python3 tools/package_native_release.py
          --release-id "$RELEASE_ID" --engine-version "$ENGINE_VERSION"
          --windows-runtime-component qualified-runtime/windows/component.json
          --macos-runtime-component qualified-runtime/macos/component.json
          --out "$RUNNER_TEMP/release"
      - name: Remove private Apple signing keychain
        if: always() && (inputs.notarize_macos || vars.NATIVE_MACOS_NOTARIZE == 'true')
        run: python3 tools/macos_distribution.py cleanup-ci
      - uses: actions/upload-artifact@v4
        with:
          name: native-preview-desktop
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7
  ios:
    name: Required iPhone and iPad device build
    needs: build
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/download-artifact@v4
        with:
          name: native-preview-desktop
          path: ${{ runner.temp }}/desktop
      - name: Build unsigned iOS preview with the frozen engine payload
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ENGINE_VERSION: ${{ inputs.engine_version }}
        run: python3 tools/package_native_port.py --platform ios --payload "$RUNNER_TEMP/desktop/Gen2Recomped-NativePreview.love" --release-id "$RELEASE_ID" --engine-version "$ENGINE_VERSION" --out "$RUNNER_TEMP/ios"
      - uses: actions/upload-artifact@v4
        with:
          name: native-preview-ios
          path: ${{ runner.temp }}/ios/*
          if-no-files-found: error
          retention-days: 7
  android:
    name: Required Android APK build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk="$(sed -n 's/^NDK_VERSION="\([^"]*\)"/\1/p' scripts/build_android.sh)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"
      - uses: actions/download-artifact@v4
        with:
          name: native-preview-desktop
          path: ${{ runner.temp }}/desktop
      - name: Build and verify the separately identified preview APK
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ENGINE_VERSION: ${{ inputs.engine_version }}
        run: python3 tools/package_native_port.py --platform android --payload "$RUNNER_TEMP/desktop/Gen2Recomped-NativePreview.love" --release-id "$RELEASE_ID" --engine-version "$ENGINE_VERSION" --out "$RUNNER_TEMP/android"
      - uses: actions/upload-artifact@v4
        with:
          name: native-preview-android
          path: ${{ runner.temp }}/android/*
          if-no-files-found: error
          retention-days: 7
  switch:
    name: Required Nintendo Switch NRO build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: native-preview-desktop
          path: ${{ runner.temp }}/desktop
      - name: Build the separate SD preview with the pinned NX runtime
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ENGINE_VERSION: ${{ inputs.engine_version }}
        run: python3 tools/package_native_port.py --platform switch --payload "$RUNNER_TEMP/desktop/Gen2Recomped-NativePreview.love" --release-id "$RELEASE_ID" --engine-version "$ENGINE_VERSION" --out "$RUNNER_TEMP/switch"
      - uses: actions/upload-artifact@v4
        with:
          name: native-preview-switch
          path: ${{ runner.temp }}/switch/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [build, ios, android, switch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: native-preview-*
          path: release-inputs
      - name: Require all five platform packages and identical embedded engine bytes
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ENGINE_VERSION: ${{ inputs.engine_version }}
          REQUIRE_MACOS_NOTARIZATION: ${{ inputs.notarize_macos || vars.NATIVE_MACOS_NOTARIZE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$REQUIRE_MACOS_NOTARIZATION" == true ]]; then
            options+=(--require-macos-notarization)
          fi
          python3 tools/assemble_native_release.py --inputs release-inputs --out release --release-id "$RELEASE_ID" --engine-version "$ENGINE_VERSION" "${options[@]}"
      - name: Verify and publish a new immutable pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          ENGINE_VERSION: ${{ inputs.engine_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]{8}\.[0-9]+$ ]]
          [[ "$ENGINE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd release
          sha256sum --check SHA256SUMS.txt
          gh release create "native-preview-$RELEASE_ID" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "RetroRecomped Preview $RELEASE_ID" \
            --notes-file README-Testrelease.txt ./*
