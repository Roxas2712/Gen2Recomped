name: Frozen main android preview with qualified Lua120
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools-source
      - uses: actions/checkout@v7
        with:
          path: engine
          ref: 90a3b093e62d85440d0a1b8288e30e0caf3cc358
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"'
      - uses: actions/download-artifact@v4
        with:
          name: android-love-runtime-host-arm64-v8a
          run-id: 40771166946
          github-token: ${{ github.token }}
          path: candidates/arm64-v8a
      - uses: actions/download-artifact@v4
        with:
          name: android-love-runtime-host-armeabi-v7a
          run-id: 40771166946
          github-token: ${{ github.token }}
          path: candidates/armeabi-v7a
      - uses: actions/download-artifact@v4
        with:
          name: android-love-runtime-host-x86_64
          run-id: 40776550731
          github-token: ${{ github.token }}
          path: candidates/x86_64
      - name: Require complete source-bound host qualifications
        run: >-
          python3 tools-source/tools/mobile-runtime-check/component.py
          --platform android --engine-root engine --candidate candidates/arm64-v8a --candidate candidates/armeabi-v7a --candidate candidates/x86_64
          --output "$RUNNER_TEMP/component"
      - name: Fetch exact published engine payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Roxas2712/Gen2Recomped/releases/assets/686181921 -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/game.love"
          python3 -c 'import hashlib,os,pathlib; assert hashlib.file_digest((pathlib.Path(os.environ["RUNNER_TEMP"])/"game.love").open("rb"),"sha256").hexdigest()=="e4541d2dfff3dc59ad173a466342bb2be3a712f8d59292241a27bac9015df04f"'
      - name: Package qualified runtime with the frozen engine
        run: >-
          python3 tools-source/tools/package_native_port.py
          --platform android --engine-root engine
          --payload "$RUNNER_TEMP/game.love"
          --runtime-component "$RUNNER_TEMP/component/component.json"
          --release-id 20261028.3 --engine-version 0.8.57
          --out "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v4
        with:
          name: lua120-preview-android
          path: |
            ${{ runner.temp }}/package/*
            ${{ runner.temp }}/component/
          if-no-files-found: error
          retention-days: 14
