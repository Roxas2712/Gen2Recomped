name: Frozen Android package startup check
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frozen-main-test-android
          run-id: 40763912752
          github-token: ${{ github.token }}
          path: package
      - name: Verify exact package receipt
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('package');m=json.loads((p/'build.json').read_text())
          assert m['sourceCommit']=='90a3b093e62d85440d0a1b8288e30e0caf3cc358'
          assert m['payloadSha256']=='e4541d2dfff3dc59ad173a466342bb2be3a712f8d59292241a27bac9015df04f'
          assert hashlib.file_digest((p/m['archive']).open('rb'),'sha256').hexdigest()==m['archiveSha256']
          PY
      - name: Enable owned emulator KVM access
        run: sudo chmod a+rw /dev/kvm
      - name: Start the built preview on an owned emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          arch: x86_64
          target: default
          avd-name: gen2-preview-20261028-3
          emulator-port: 5554
          script: |
            mkdir -p evidence
            adb -s emulator-5554 install -g package/Gen2Recomped-NativePreview-20261028.3-android.apk
            adb -s emulator-5554 logcat -c
            adb -s emulator-5554 shell am start -W -n de.roxas2712.gen2recomp.nativepreview/org.love2d.android.GameActivity > evidence/start.txt
            sleep 25
            adb -s emulator-5554 shell pidof de.roxas2712.gen2recomp.nativepreview > evidence/pid.txt
            adb -s emulator-5554 exec-out screencap -p > evidence/launcher.png
            adb -s emulator-5554 logcat -d > evidence/logcat.txt
            adb -s emulator-5554 shell dumpsys activity activities > evidence/activities.txt
            test -s evidence/pid.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-main-android-startup
          path: evidence/*
          if-no-files-found: error
          retention-days: 14
