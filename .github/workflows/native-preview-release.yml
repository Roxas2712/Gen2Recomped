name: RetroRecomped intermediate pre-release
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Preview identifier (YYYYMMDD.N)'
        required: true
        type: string
      engine_version:
        description: 'Engine version stamped into both packages (X.Y.Z)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-preview-publish
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: python3 tools/run_retro_launcher_contract.py
  build:
    needs: contract
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Package committed source with verified official LOVE 12 runtimes
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ENGINE_VERSION: ${{ inputs.engine_version }}
        run: python3 tools/package_native_release.py --release-id "$RELEASE_ID" --engine-version "$ENGINE_VERSION" --out "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: native-preview-release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-preview-release
          path: release
      - name: Verify and publish a new immutable pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          ENGINE_VERSION: ${{ inputs.engine_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]{8}\.[0-9]+$ ]]
          [[ "$ENGINE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd release
          sha256sum --check SHA256SUMS.txt
          gh release create "native-preview-$RELEASE_ID" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "RetroRecomped Preview $RELEASE_ID" \
            --notes-file README-Testrelease.txt ./*
