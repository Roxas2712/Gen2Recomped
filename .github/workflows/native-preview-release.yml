# One-time desktop build definition; dispatched on this branch only.
# Engine checkout remains the frozen, already-merged main revision.
name: Existing desktop preview refresh
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Existing preview identifier (YYYYMMDD.N)'
        required: true
        type: string
      engine_version:
        description: 'Desktop engine version (X.Y.Z)'
        required: true
        type: string
      source_ref:
        description: 'Frozen main commit (40 hexadecimal characters)'
        required: true
        type: string
      runtime_run:
        description: 'Successful public Native runtime capacity run for this source'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-preview-refresh-${{ inputs.release_id }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Roxas2712/Gen2Recomped' && !github.event.repository.private
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify public source, runtime qualification and existing target
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_ID: ${{ inputs.release_id }}
          RUNTIME_RUN: ${{ inputs.runtime_run }}
        shell: python
        run: |
          import json, os, re, subprocess
          repo = 'Roxas2712/Gen2Recomped'
          def api(path): return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          assert not api('repos/' + repo)['private']
          sha = os.environ['SOURCE_REF']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == sha
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'origin/main'], check=True)
          run = api('repos/' + repo + '/actions/runs/' + os.environ['RUNTIME_RUN'])
          assert run['conclusion'] == 'success'
          # A merge commit may have a different ID while retaining the exact
          # qualified source and test tree. Receipts still retain their real SHA.
          assert subprocess.check_output(['git', 'rev-parse', run['head_sha'] + '^{tree}'], text=True).strip() == subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert run['path'] == '.github/workflows/runtime-upvalues.yml'
          release = api('repos/' + repo + '/releases/tags/native-preview-' + os.environ['RELEASE_ID'])
          assert release['prerelease'] and not release['draft'] and not release.get('immutable', False)
          print('Frozen main, public qualified runtime and existing mutable preview verified')
      - uses: actions/download-artifact@v8
        with:
          name: qualified-desktop-runtime
          run-id: ${{ inputs.runtime_run }}
          github-token: ${{ github.token }}
          path: qualified-runtime
      - name: Verify preview packaging guards
        run: python3 -m unittest discover -s tests -p test_native_preview.py -v
      - name: Package only Windows and macOS from the frozen main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          ENGINE_VERSION: ${{ inputs.engine_version }}
        run: >-
          python3 tools/package_native_release.py
          --release-id "$RELEASE_ID" --engine-version "$ENGINE_VERSION"
          --windows-runtime-component qualified-runtime/windows/component.json
          --macos-runtime-component qualified-runtime/macos/component.json
          --out "$RUNNER_TEMP/desktop-refresh"
      - name: Verify completed desktop checksums
        run: cd "$RUNNER_TEMP/desktop-refresh" && shasum -a 256 -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-refresh-${{ inputs.release_id }}
          path: ${{ runner.temp }}/desktop-refresh/*
          if-no-files-found: error
          retention-days: 7
