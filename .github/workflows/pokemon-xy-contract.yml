name: Pokemon X/Y launcher and mods
on:
  pull_request:
    paths:
      - main.lua
      - src/import/**
      - tools/pokemon*py
      - tools/ascendant-intro/**
      - tools/run_pokemon_xy_contract.py
      - tests/pokemon*test.py
      - tests/engine/pokemon_xy*.lua
      - tests/pokemon_xy/**
      - tests/engine/launcher_sequence.lua
      - .github/workflows/pokemon-xy-contract.yml
  workflow_dispatch:
    inputs:
      native_windows_sdk:
        description: Build and test the Windows native game SDK
        type: boolean
        default: false
      native_windows_sdk_run_id:
        description: Requalify an unchanged native Windows SDK run
        type: string
        default: ''
      native_windows_sdk_candidate:
        description: Retest a compiled candidate, with all native tests required
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pokemon-xy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  headless:
    if: ${{ inputs.native_windows_sdk != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ROM-free test runtimes
        run: sudo apt-get update && sudo apt-get install -y luajit lua5.4
      - name: Check imports, mods, language and presentation without game data
        run: python3 tools/run_pokemon_xy_contract.py
  native-windows-sdk:
    if: ${{ inputs.native_windows_sdk == true }}
    uses: ./.github/workflows/windows-native-games.yml
    permissions:
      contents: read
      actions: read
    with:
      sdk_run_id: ${{ inputs.native_windows_sdk_run_id }}
      sdk_candidate: ${{ inputs.native_windows_sdk_candidate }}
