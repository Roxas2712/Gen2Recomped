name: Android LÖVE runtime host
on:
  workflow_call:
  pull_request:
    paths:
      - 'tools/mobile-runtime-check/**'
      - 'tools/runtime-upvalue-check/**'
      - 'mobile/android/**'
      - '.github/workflows/android-love-runtime.yml'
  workflow_dispatch:
    inputs:
      abi:
        type: choice
        options: [all, arm64-v8a, armeabi-v7a, x86_64]
        default: all
        description: Target ABI coverage
      reuse_run:
        type: string
        default: ''
        description: Optional prior run whose unchanged native QA APKs should receive current probes
permissions:
  contents: read
  actions: read
concurrency:
  group: android-love-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.abi == 'x86_64' && '["x86_64"]' || inputs.abi == 'arm64-v8a' && '["arm64-v8a"]' || inputs.abi == 'armeabi-v7a' && '["armeabi-v7a"]' || '["arm64-v8a","armeabi-v7a","x86_64"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned Android toolchain
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          'platforms;android-34' 'build-tools;34.0.0' 'ndk;25.2.9519653'
      - name: Install host multilib
        if: inputs.reuse_run == ''
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Build matching VM candidates
        if: inputs.reuse_run == ''
        run: >-
          python3 tools/mobile-runtime-check/build_android.py
          --ndk "$ANDROID_HOME/ndk/25.2.9519653" --abi '${{ matrix.abi }}'
          --output '${{ runner.temp }}/android-vm/candidate'
      - name: Build actual LÖVE apps in an owned source copy
        if: inputs.reuse_run == ''
        run: >-
          python3 tools/mobile-runtime-check/qualify_android_love.py build
          --abi '${{ matrix.abi }}'
          --build '${{ runner.temp }}/android-vm/candidate'
          --output '${{ runner.temp }}/android-love/candidate'
      - uses: actions/download-artifact@v4
        if: inputs.reuse_run != ''
        with:
          name: android-love-runtime-host-${{ matrix.abi }}
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reused
      - name: Refresh public probes while preserving native binary bytes
        if: inputs.reuse_run != ''
        run: |
          cp -R "$RUNNER_TEMP/reused/android-vm" "$RUNNER_TEMP/android-vm"
          python3 tools/mobile-runtime-check/refresh_android_probes.py \
            --build "$RUNNER_TEMP/reused/android-love/candidate" \
            --output "$RUNNER_TEMP/android-love/candidate"
      - name: Enable the owned emulator's KVM access
        run: sudo chmod a+rw /dev/kvm
      - name: Execute the actual JNI, LÖVE, thread and FFI host
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          avd-name: gen2-love-runtime-qa
          emulator-port: 5554
          script: |
            if [ '${{ matrix.abi }}' = x86_64 ]; then python3 tools/mobile-runtime-check/check_android_target.py --serial emulator-5554 --abi x86_64 --build '${{ runner.temp }}/android-vm/candidate' --output '${{ runner.temp }}/android-target/candidate'; fi
            python3 tools/mobile-runtime-check/qualify_android_love.py run --serial emulator-5554 --build '${{ runner.temp }}/android-love/candidate' --output '${{ runner.temp }}/android-love-execution/candidate'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-love-runtime-host-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/android-vm/candidate/report.json
            ${{ runner.temp }}/android-vm/candidate/*.log
            ${{ runner.temp }}/android-vm/candidate/artifacts/
            ${{ runner.temp }}/android-love/candidate/report.json
            ${{ runner.temp }}/android-love/candidate/*.log
            ${{ runner.temp }}/android-love/candidate/*.apk
            ${{ runner.temp }}/android-love-execution/candidate/*.json
            ${{ runner.temp }}/android-love-execution/candidate/*.log
            ${{ runner.temp }}/android-love-execution/candidate/*.png
            ${{ runner.temp }}/android-target/candidate/*.json
            ${{ runner.temp }}/android-target/candidate/*.log
          if-no-files-found: warn
          retention-days: 7
