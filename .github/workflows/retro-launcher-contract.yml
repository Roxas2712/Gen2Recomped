name: RetroRecomped launcher integration
on:
  pull_request:
    paths:
      - main.lua
      - conf.lua
      - src/core/Game.lua
      - src/core/SaveData.lua
      - src/cloud/**
      - src/import/**
      - src/mods/**
      - src/storage/**
      - src/ui/RetroOverlay.lua
      - tests/engine/**
      - tools/launcher_library_preview/**
      - tools/run_retro_launcher_contract.py
      - .github/workflows/retro-launcher-contract.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retro-launcher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ROM-free test runtime
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check launcher contracts without a game runtime
        run: python3 tools/run_retro_launcher_contract.py
