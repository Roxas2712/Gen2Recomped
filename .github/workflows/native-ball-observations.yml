name: Native ball presentation observations
on:
  pull_request:
    paths:
      - 'src/compat/gen1/NativeBallObservation.lua'
      - 'src/import/RomExtractorGen3.lua'
      - 'src/import/RomImporter.lua'
      - 'src/battle/BattleState.lua'
      - 'src/import/Gen3BallSendOutProfile.lua'
      - 'tests/engine/native_ball_sendout_import.lua'
      - 'src/core/game3/battle/stage.lua'
      - 'src/core/game3/battle/catch_seq.lua'
      - 'src/battle/Gen3BallAnim.lua'
      - 'tests/engine/native_ball_flight_observations.lua'
      - '.github/workflows/native-ball-observations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Actual native clocks, stage and capture identity
        run: |
          luajit tests/engine/native_ball_sendout_import.lua
          luajit tests/engine/native_ball_flight_observations.lua
          luajit tests/engine/native_battle_stage.lua
          luajit tests/engine/native_capture_sequence.lua
          luajit tests/engine/native_ball_presentation.lua
          luajit tests/engine/gen2_battle_scene.lua
