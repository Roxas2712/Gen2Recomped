name: Portable asset pack contracts
on:
  pull_request:
    paths:
      - 'src/import/Pack*.lua'
      - 'src/import/Importers.lua'
      - 'src/import/CacheFs.lua'
      - 'src/import/LuaWriter.lua'
      - 'src/import/RomImporter.lua'
      - 'src/mods/AssetPacks.lua'
      - 'src/mods/StreamMD5.lua'
      - 'src/mods/Manifest.lua'
      - 'src/mods/Loader.lua'
      - 'src/mods/LauncherMods.lua'
      - 'src/mods/ManagerState.lua'
      - 'tests/engine/asset_pack_contracts.lua'
      - 'tests/asset_pack_runtime/**'
      - '.github/workflows/mod-asset-packs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y luajit lua5.4
      - run: luajit tests/engine/asset_pack_contracts.lua
      - name: Check the portable data parser on plain Lua
        run: lua5.4 -e 'local d=require("src.import.PackData");local w=require("src.import.LuaWriter");assert(d.decode(w.encode({1,true,"x"}))[3]=="x");assert(not d.decode("return os.exit()"))'
