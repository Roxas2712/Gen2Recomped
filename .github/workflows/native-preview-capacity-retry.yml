name: Retry unassigned native release capacity
on:
  workflow_run:
    workflows: ['RetroRecomped intermediate pre-release']
    types: [completed]
  push:
    paths: ['tools/ci/native_capacity_retry.py', 'tests/test_native_capacity_retry.py', '.github/workflows/native-preview-capacity-retry.yml']
  pull_request:
    paths: ['tools/ci/native_capacity_retry.py', 'tests/test_native_capacity_retry.py', '.github/workflows/native-preview-capacity-retry.yml']
permissions:
  contents: read
concurrency:
  group: native-release-capacity-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false
jobs:
  contract:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -p test_native_capacity_retry.py -v
  retry:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 tools/ci/native_capacity_retry.py
        env:
          GH_TOKEN: ${{ github.token }}
