name: Native cry fallback completion
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: luajit tests/engine/native_cry_fallback_owner.lua
      - run: luajit tests/engine/gen3_native_cry.lua
