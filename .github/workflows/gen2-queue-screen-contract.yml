name: native Gen2 queue screen contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gen2-queue-screen-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ROM-free runtime
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Native and source Gen2 creation and field teaching coexist
        run: |
          failed=0
          for suite in gen2_source_birth gen2_learning_native gen2_field_learning gen2_legacy_content; do
            if ! luajit "tests/engine/$suite.lua"; then failed=1; fi
          done
          exit "$failed"
      - name: Previous native source exposes the item-result regressions
        shell: bash
        run: |
          git -c gc.auto=0 fetch --no-tags --depth=1 origin b4bb770ccba2cf6f05eefb34d9a3c3f531c1ad95
          baseline="$RUNNER_TEMP/gen2-party-result-baseline"
          mkdir -p "$baseline"
          git archive b4bb770ccba2cf6f05eefb34d9a3c3f531c1ad95 src tests data tools examples | tar -x -C "$baseline"
          cp src/render/NativeScreenOverlay.lua "$baseline/src/render/NativeScreenOverlay.lua"
          cp src/ui/Gen2PartyItemResult.lua "$baseline/src/ui/Gen2PartyItemResult.lua"
          cp src/ui/Gen2MoveDeleter.lua src/ui/Gen2ForgetMoveList.lua "$baseline/src/ui/"
          cp src/pokemon/Gen2PP.lua "$baseline/src/pokemon/Gen2PP.lua"
          cp tests/engine/gen2_pp_selection.lua "$baseline/tests/engine/gen2_pp_selection.lua"
          cp tests/engine/gen2_battle_pack.lua tests/engine/gen2_party_item_result.lua "$baseline/tests/engine/"
          for suite in gen2_party_item_result gen2_battle_pack gen2_pp_selection; do
            if (cd "$baseline" && luajit "tests/engine/$suite.lua") > "$RUNNER_TEMP/$suite-baseline.log" 2>&1; then
              cat "$RUNNER_TEMP/$suite-baseline.log"
              echo "Previous source unexpectedly passed $suite"
              exit 1
            fi
            cat "$RUNNER_TEMP/$suite-baseline.log"
            grep -q '^FAIL' "$RUNNER_TEMP/$suite-baseline.log"
          done
      - name: Native screen, queue, input and current message ownership
        run: |
          failed=0
          for suite in gen2_battle_queue_view gen2_move_selection gen2_battle_submenu gen2_battle_pack gen2_party_item_result gen2_pp_selection screen_space_ui party_live_data party_grid_navigation gen2_battle_scene gen2_battle_window battle_queue_lifecycle; do
            if ! luajit "tests/engine/$suite.lua"; then failed=1; fi
          done
          exit "$failed"
      - name: Public snapshots, dispatch and deterministic continuation
        if: success() || failure()
        run: |
          failed=0
          for suite in battle_snapshots battle_actions checkpoint_battle_continuation; do
            if ! luajit "tests/engine/$suite.lua"; then failed=1; fi
          done
          exit "$failed"
      - name: Loopback battle, independent replay and native link completion
        if: success() || failure()
        run: |
          failed=0
          for suite in arena_battle_proof arena_replay link_battle_ended; do
            if ! luajit "tests/engine/$suite.lua"; then failed=1; fi
          done
          exit "$failed"
      - name: Shared PP readers, callbacks, held items, bank and older edition behavior
        if: success() || failure()
        run: |
          failed=0
          for suite in item_use_dispatch world_read_api unified_mod_callbacks held_item_contract held_item_authority held_item_content held_item_scheduling pokemon_bank bank_interop bank_verification gen2_summary_contract gen2_battle_live_view gen2_alias_world_reads; do
            if ! luajit "tests/engine/$suite.lua"; then failed=1; fi
          done
          exit "$failed"
