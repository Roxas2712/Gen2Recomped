name: Native release package contract
on:
  pull_request:
    paths:
      - 'tools/*native*release*.py'
      - 'tools/package_native_port.py'
      - 'tools/build_native_preview.py'
      - 'tools/stage_game_payload.py'
      - 'src/core/NativePreview.lua'
      - 'tests/native_release_test.py'
      - '.github/workflows/native-preview-release.yml'
      - '.github/workflows/native-release-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: python3 tests/game_payload_test.py
      - run: python3 tests/native_release_test.py
      - run: python3 -m unittest discover -s tests -p test_native_preview.py
      - run: luajit tests/engine/native_preview.lua
