[package]
name = "ascendant-3ds-bridge"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE-ROXAS2712.md"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
zakuro-core = { path = "../../.local/pokemon-x/zakuro/crates/zakuro-core" }
zakuro-gpu = { path = "../../.local/pokemon-x/zakuro/crates/zakuro-gpu", features = ["opengl", "vulkan"] }
zakuro-common = { path = "../../.local/pokemon-x/zakuro/crates/zakuro-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
env_logger = "0.11"
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash64"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = 0
